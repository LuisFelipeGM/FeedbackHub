plugins {
	id 'java'
	id 'application'
}

group = 'com.fiap.feedbackhub'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	cdkVersion = '2.165.0'
}

dependencies {
	implementation "software.amazon.awscdk:aws-cdk-lib:${cdkVersion}"
	implementation 'software.constructs:constructs:10.4.2'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
	mainClass = 'com.fiap.feedbackhub.infra.FeedbackhubApp'
}

tasks.named('test') {
	useJUnitPlatform()
}
